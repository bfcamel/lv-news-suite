name: Patch home news block

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-home-news.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Apply only requested homepage changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('includes/class-lv-news-public.php')
          text = path.read_text()

          old_wrapper = '<div class="lv-home-news" data-lv-news-version="<?php echo esc_attr(LV_NEWS_SUITE_VERSION); ?>">'
          new_wrapper = '<div class="lv-home-news" data-lv-news-version="<?php echo esc_attr(LV_NEWS_SUITE_VERSION); ?>" style="background:#fff">'
          if old_wrapper not in text:
              raise SystemExit('Home news wrapper not found')
          text = text.replace(old_wrapper, new_wrapper, 1)

          old_section = '<section class="hn-sec" aria-label="Свежие новости">'
          new_section = '''<section class="hn-sec" aria-label="Свежие новости">
                <h2 class="hn-title" style="margin:0 0 clamp(28px,3.2vw,40px);color:var(--teal);font-family:var(--lv-news-serif);font-size:clamp(30px,3.6vw,46px);line-height:1.15;font-weight:400;text-align:center">Последние новости</h2>'''
          if old_section not in text:
              raise SystemExit('Home news section not found')
          text = text.replace(old_section, new_section, 1)

          path.write_text(text)
          PY

      - name: Verify scope
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "includes/class-lv-news-public.php"
          php -l includes/class-lv-news-public.php

      - name: Commit requested changes
        run: |
          git config user.name "People & Camels"
          git config user.email "bfcamel@yandex.ru"
          git add includes/class-lv-news-public.php
          git commit -m "Make home news block white and add heading"
          git push
