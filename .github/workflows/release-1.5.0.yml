name: Release 1.5.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-1.5.0.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and release version
        run: |
          find includes -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l lv-news-suite.php
          grep -F 'Version: 1.5.0' lv-news-suite.php
          grep -F "define('LV_NEWS_SUITE_VERSION', '1.5.0');" lv-news-suite.php
          grep -F 'Stable tag: 1.5.0' readme.txt
      - name: Build installable plugin
        run: python3 tools/build-release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5.0 dist/lv-news-suite-1.5.0.zip dist/lv-news-suite-1.5.0.sha256 \
            --target "$GITHUB_SHA" --title 'LV News Suite 1.5.0' \
            --notes-file docs/RELEASE-NOTES-1.5.0.md
