name: Release 1.4.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-1.4.2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 1.4.2 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('assets/public.css')
          css = css_path.read_text()

          old_body = """body.lv-news-page,\nbody.lv-news-page .site-main,\nbody.lv-news-page .page-content{background:var(--lv-news-beige)}\n"""
          if old_body not in css:
              raise SystemExit('Expected archive page background block not found')
          css = css.replace(old_body, '', 1)

          old_archive = "#lvNewsArchive{\n  position:relative;left:50%;width:100vw;max-width:100vw;margin-right:-50vw!important;margin-left:-50vw!important;overflow:hidden;background:var(--lv-news-beige)\n}"
          new_archive = "#lvNewsArchive{\n  position:relative;left:50%;width:100vw;max-width:100vw;margin-right:-50vw!important;margin-left:-50vw!important;overflow:hidden\n}"
          if old_archive not in css:
              raise SystemExit('Expected archive wrapper background not found')
          css = css.replace(old_archive, new_archive, 1)

          old_home = ".lv-home-news{\n  position:relative;left:50%;width:100vw;max-width:100vw;margin-right:-50vw!important;margin-left:-50vw!important;overflow:hidden;background:var(--lv-news-beige);color:var(--teal)\n}"
          new_home = ".lv-home-news{\n  position:relative;left:50%;width:100vw;max-width:100vw;margin-right:-50vw!important;margin-left:-50vw!important;overflow:hidden;color:var(--teal)\n}"
          if old_home not in css:
              raise SystemExit('Expected home wrapper background not found')
          css = css.replace(old_home, new_home, 1)
          css_path.write_text(css)

          public_path = Path('includes/class-lv-news-public.php')
          public = public_path.read_text()
          old_markup = '<div class="lv-home-news" data-lv-news-version="<?php echo esc_attr(LV_NEWS_SUITE_VERSION); ?>" style="background:#fff">'
          new_markup = '<div class="lv-home-news" data-lv-news-version="<?php echo esc_attr(LV_NEWS_SUITE_VERSION); ?>">'
          if old_markup not in public:
              raise SystemExit('Expected inline home background not found')
          public = public.replace(old_markup, new_markup, 1)
          public_path.write_text(public)

          plugin_path = Path('lv-news-suite.php')
          plugin = plugin_path.read_text()
          if 'Version: 1.4.1' not in plugin or "define('LV_NEWS_SUITE_VERSION', '1.4.1');" not in plugin:
              raise SystemExit('Expected plugin version 1.4.1 not found')
          plugin = plugin.replace('Version: 1.4.1', 'Version: 1.4.2', 1)
          plugin = plugin.replace("define('LV_NEWS_SUITE_VERSION', '1.4.1');", "define('LV_NEWS_SUITE_VERSION', '1.4.2');", 1)
          plugin_path.write_text(plugin)

          readme_path = Path('readme.txt')
          readme = readme_path.read_text()
          if 'Stable tag: 1.4.1' not in readme:
              raise SystemExit('Expected readme stable tag 1.4.1 not found')
          readme = readme.replace('Stable tag: 1.4.1', 'Stable tag: 1.4.2', 1)
          marker = '== Версия 1.4.1 ==\n'
          if marker not in readme:
              raise SystemExit('Expected 1.4.1 section not found')
          section = """== Версия 1.4.2 ==\n\nФон секций новостей теперь полностью управляется страницей/Elementor:\n* у архива [lv_news_archive] удалён собственный бежевый фон;\n* у блока [lv_home_news] удалены и CSS-фон, и inline-белый фон;\n* плагин больше не задаёт фон body/site-main/page-content страницы архива;\n* белый фон самих карточек сохранён;\n* фон отдельной страницы новости не изменён.\n\n\n"""
          readme = readme.replace(marker, section + marker, 1)
          readme_path.write_text(readme)
          PY

      - name: Check PHP syntax and version
        run: |
          php -l lv-news-suite.php
          php -l includes/class-lv-news-public.php
          grep -F "Version: 1.4.2" lv-news-suite.php
          grep -F "define('LV_NEWS_SUITE_VERSION', '1.4.2');" lv-news-suite.php
          grep -F "Stable tag: 1.4.2" readme.txt
          if grep -F 'style="background:#fff"' includes/class-lv-news-public.php; then
            echo 'Inline home background is still present'
            exit 1
          fi
          if grep -F 'body.lv-news-page .page-content{background:var(--lv-news-beige)}' assets/public.css; then
            echo 'Archive page background is still forced'
            exit 1
          fi

      - name: Commit plugin update
        run: |
          git config user.name "People & Camels"
          git config user.email "bfcamel@yandex.ru"
          git add assets/public.css includes/class-lv-news-public.php lv-news-suite.php readme.txt
          git commit -m "Release LV News Suite 1.4.2"
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p build/lv-news-suite
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='*.zip' \
            ./ build/lv-news-suite/
          cd build
          zip -rq ../lv-news-suite-1.4.2.zip lv-news-suite

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## LV News Suite 1.4.2

          - Фон архива новостей больше не задаётся плагином и наследуется от страницы/Elementor.
          - Фон блока `[lv_home_news]` больше не задаётся ни CSS, ни inline-стилем и наследуется от контейнера Elementor.
          - Принудительный фон `body`, `.site-main` и `.page-content` для страницы архива удалён.
          - Белый фон самих карточек новостей сохранён.
          - Оформление отдельной страницы новости не менялось.
          EOF

          if gh release view v1.4.2 >/dev/null 2>&1; then
            gh release delete v1.4.2 --yes --cleanup-tag
          fi

          gh release create v1.4.2 \
            lv-news-suite-1.4.2.zip \
            --target "$RELEASE_SHA" \
            --title "LV News Suite 1.4.2" \
            --notes-file release-notes.md
