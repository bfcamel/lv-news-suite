name: Release 1.4.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-1.4.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Bump plugin version and readme
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plugin = Path('lv-news-suite.php')
          text = plugin.read_text()
          text = text.replace('Version: 1.4.0', 'Version: 1.4.1', 1)
          text = text.replace("define('LV_NEWS_SUITE_VERSION', '1.4.0');", "define('LV_NEWS_SUITE_VERSION', '1.4.1');", 1)
          plugin.write_text(text)

          readme = Path('readme.txt')
          text = readme.read_text()
          text = text.replace('Stable tag: 1.4.0', 'Stable tag: 1.4.1', 1)
          marker = 'Редакционная система новостей фонда: визуальный Gutenberg/WYSIWYG-редактор, архив /news/, главная новость, предпросмотр, SEO и контроль готовности материала.\n\n'
          section = '''\n== Версия 1.4.1 ==\n\nНебольшое обновление главного блока новостей:\n* фон блока [lv_home_news] на главной странице изменён на белый;\n* над карточками добавлен заголовок «Последние новости»;\n* остальное оформление и функциональность плагина не изменялись.\n\n'''
          if '== Версия 1.4.1 ==' not in text:
              text = text.replace(marker, marker + section, 1)
          readme.write_text(text)
          PY

      - name: Check PHP syntax
        run: |
          php -l lv-news-suite.php
          php -l includes/class-lv-news-public.php

      - name: Commit release metadata
        run: |
          git config user.name "People & Camels"
          git config user.email "bfcamel@yandex.ru"
          git add lv-news-suite.php readme.txt
          git commit -m "Release 1.4.1" || true
          git push origin HEAD:main

      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p build/lv-news-suite
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='*.zip' \
            ./ build/lv-news-suite/
          cd build
          zip -rq ../lv-news-suite-1.4.1.zip lv-news-suite

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## LV News Suite 1.4.1

          - Фон блока новостей на главной странице заменён на белый.
          - Над карточками добавлен заголовок «Последние новости».
          - Остальное оформление и функциональность плагина не изменялись.
          EOF

          TARGET_SHA="$(git rev-parse HEAD)"
          if gh release view v1.4.1 >/dev/null 2>&1; then
            echo 'Release v1.4.1 already exists; nothing to do.'
            exit 0
          fi

          gh release create v1.4.1 \
            lv-news-suite-1.4.1.zip \
            --target "$TARGET_SHA" \
            --title "LV News Suite 1.4.1" \
            --notes-file release-notes.md
